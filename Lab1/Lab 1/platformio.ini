[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

lib_deps = 
    olikraus/U8g2@^2.36.0
	paulstoffregen/OneWire@^2.3.5
	milesburton/DallasTemperature@^3.9.0
    bblanchon/ArduinoJson@^7.1.0
